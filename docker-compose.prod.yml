services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-p7scanner}
      POSTGRES_USER: ${POSTGRES_USER:-p7scanner}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-strong}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-p7scanner} -d ${POSTGRES_DB:-p7scanner}"]
      interval: 10s
      timeout: 3s
      retries: 10

  api:
    image: ${API_IMAGE:-${IMAGE_REGISTRY:-ghcr.io}/${IMAGE_NAMESPACE:-signalforge-org}/signalforge-hub-api:${IMAGE_TAG:-latest}}
    restart: unless-stopped
    environment:
      LISTEN_ADDR: :8080
      DATABASE_URL: ${DATABASE_URL:-postgres://${POSTGRES_USER:-p7scanner}:${POSTGRES_PASSWORD:-change-me-strong}@postgres:5432/${POSTGRES_DB:-p7scanner}?sslmode=disable}
      APP_ENV: ${APP_ENV}
      STACK_ID: ${STACK_ID:-prod-compose}
      DEPLOY_TAG: ${DEPLOY_TAG:-${IMAGE_TAG}}
      LOG_LEVEL: ${LOG_LEVEL}
      APP_BASE_URL: ${APP_BASE_URL}
      MAILJET_API_KEY: ${MAILJET_API_KEY}
      MAILJET_SECRET_KEY: ${MAILJET_SECRET_KEY}
      MAIL_FROM_EMAIL: ${MAIL_FROM_EMAIL}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-SignalForge Hub}
      HUB_NAME: ${HUB_NAME:-SignalForge Hub}
      HUB_PUBLIC_URL: ${HUB_PUBLIC_URL:-${APP_BASE_URL}}
      HUB_REGION: ${HUB_REGION:-}
      HUB_CONTACT: ${HUB_CONTACT:-}
      HUB_FEDERATION_ENABLED: ${HUB_FEDERATION_ENABLED:-false}
      HUB_TRUST_LEVEL: ${HUB_TRUST_LEVEL:-community}
      HUB_TRUST_ISSUER: ${HUB_TRUST_ISSUER:-}
      HUB_TRUST_CERTIFICATE: ${HUB_TRUST_CERTIFICATE:-}
      HUB_TRUST_EXPIRES_AT: ${HUB_TRUST_EXPIRES_AT:-0}
      HUB_DIRECTORY_URL: ${HUB_DIRECTORY_URL:-https://signalforge.org/directory/hubs.json}
      UPDATE_CHECK_URL: ${UPDATE_CHECK_URL:-https://signalforge.org/p7-scanner-update.json}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${SERVER_PORT}:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/api/v1/health"]
      interval: 10s
      timeout: 3s
      retries: 5

  web:
    image: ${WEB_IMAGE:-${IMAGE_REGISTRY:-ghcr.io}/${IMAGE_NAMESPACE:-signalforge-org}/signalforge-hub-web:${IMAGE_TAG:-latest}}
    restart: unless-stopped
    ports:
      - "${CLIENT_PORT}:8080"
    depends_on:
      api:
        condition: service_healthy

  mock-call-sender:
    image: ${MOCK_CALL_SENDER_IMAGE:-${IMAGE_REGISTRY:-ghcr.io}/${IMAGE_NAMESPACE:-signalforge-org}/signalforge-hub-mock-call-sender:${IMAGE_TAG:-latest}}
    restart: unless-stopped
    profiles: ["mock"]
    environment:
      SCANNER_URL: ${SCANNER_URL:-http://api:8080}
      MOCK_INTERVAL_SEC: ${MOCK_INTERVAL_SEC:-5}
      MOCK_DURATION_SEC: ${MOCK_DURATION_SEC:-3}
      MOCK_SYSTEM_ID: ${MOCK_SYSTEM_ID:-1}
      MOCK_SYSTEM_LABEL: ${MOCK_SYSTEM_LABEL:-Mock P25 System}
      MOCK_FREQUENCY: ${MOCK_FREQUENCY:-460000000}
      MOCK_SOURCE_API_KEY: ${MOCK_SOURCE_API_KEY:-}
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
