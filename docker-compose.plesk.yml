# Plesk deployment compose file.
#
# Differences from docker-compose.prod.yml:
#   - Server is NOT exposed on the host network. It is only reachable
#     by the client container internally. Plesk's reverse proxy fronts
#     the client only.
#   - CLIENT_PORT should match the port you set in the Plesk Docker proxy rule.
#
# Auth / secrets — use Portainer or Plesk stack "Environment variables" (recommended):
#   AUTH_BOOTSTRAP_EMAIL, AUTH_BOOTSTRAP_PASSWORD (required), AUTH_PASSWORD_LOGIN_ENABLED=true
# Or put the same keys in .env.production beside this file (api loads it via env_file).
# After changing env vars: Update stack with "Pull and redeploy" / force-recreate (not Restart).
#
# Minimal vars for first deploy:
#   - POSTGRES_PASSWORD
#   - CLIENT_PORT (optional; defaults to 3000)
#
# Images are resolved from IMAGE_REGISTRY, IMAGE_NAMESPACE, and IMAGE_TAG.
# Official runtime images are published under ghcr.io/signalforge-org.
#
# Transcription worker starts by default. Set TRANSCRIPTION_WORKER_TOKEN
# (same value on api + transcriber) or leave blank to disable queueing entirely.
#
# With mock radio sidecar (test/staging only):
#   docker compose --env-file .env.production -f docker-compose.plesk.yml --profile mock up -d
#
# Call archive runs as a background job (no long HTTP hold). If you use sync mode or other
# long admin requests through Plesk's reverse proxy, raise its read timeout above 120s.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-p7scanner}
      POSTGRES_USER: ${POSTGRES_USER:-p7scanner}
      # Portainer/Plesk validates variables before stack creation; use a bootstrap default.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-strong}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-p7scanner} -d ${POSTGRES_DB:-p7scanner}"]
      interval: 10s
      timeout: 3s
      retries: 10

  api:
    image: ${API_IMAGE:-${IMAGE_REGISTRY:-ghcr.io}/${IMAGE_NAMESPACE:-signalforge-org}/signalforge-hub-api:${IMAGE_TAG:-latest}}
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - path: .env.production
        required: false
      - path: .env
        required: false
    environment:
      LISTEN_ADDR: :8080
      DATABASE_URL: ${DATABASE_URL:-postgres://${POSTGRES_USER:-p7scanner}:${POSTGRES_PASSWORD:-change-me-strong}@postgres:5432/${POSTGRES_DB:-p7scanner}?sslmode=disable}
      APP_ENV: ${APP_ENV:-production}
      STACK_ID: ${STACK_ID:-plesk-stack}
      IMAGE_TAG: ${IMAGE_TAG:-latest}
      DEPLOY_TAG: ${DEPLOY_TAG:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      APP_BASE_URL: ${APP_BASE_URL}
      MAILJET_API_KEY: ${MAILJET_API_KEY}
      MAILJET_SECRET_KEY: ${MAILJET_SECRET_KEY}
      MAIL_FROM_EMAIL: ${MAIL_FROM_EMAIL}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-SignalForge Hub}
      HUB_NAME: ${HUB_NAME:-SignalForge Hub}
      HUB_PUBLIC_URL: ${HUB_PUBLIC_URL:-${APP_BASE_URL}}
      HUB_REGION: ${HUB_REGION:-}
      HUB_CONTACT: ${HUB_CONTACT:-}
      HUB_FEDERATION_ENABLED: ${HUB_FEDERATION_ENABLED:-false}
      HUB_TRUST_LEVEL: ${HUB_TRUST_LEVEL:-community}
      HUB_TRUST_ISSUER: ${HUB_TRUST_ISSUER:-}
      HUB_TRUST_CERTIFICATE: ${HUB_TRUST_CERTIFICATE:-}
      HUB_TRUST_EXPIRES_AT: ${HUB_TRUST_EXPIRES_AT:-0}
      HUB_DIRECTORY_URL: ${HUB_DIRECTORY_URL:-https://signalforge.org/directory/hubs.json}
      UPDATE_CHECK_URL: ${UPDATE_CHECK_URL:-https://signalforge.org/p7-scanner-update.json}
      TRANSCRIPTION_WORKER_TOKEN: ${TRANSCRIPTION_WORKER_TOKEN:-}
      TRANSCRIPTION_MIN_DURATION_SECONDS: ${TRANSCRIPTION_MIN_DURATION_SECONDS:-0.75}
      # Pass-through from stack Environment variables (no ${} — avoids wiping values and
      # avoids compose re-parsing $ characters inside passwords).
      AUTH_BOOTSTRAP_EMAIL:
      AUTH_BOOTSTRAP_PASSWORD:
      AUTH_PASSWORD_LOGIN_ENABLED:
      AUTH_AUTO_APPROVE_USERS:
      # Pass-through (no ${}) so Portainer stack env reaches the api container reliably.
      CALL_RETENTION_DAYS:
      CALL_ARCHIVE_DIR:
      CALL_ARCHIVE_S3_URI:
      CALL_ARCHIVE_S3CFG:
      CALL_ARCHIVE_DELETE_LOCAL_AFTER_S3:
      SPACES_ACCESS_KEY:
      SPACES_SECRET_KEY:
      SPACES_ENDPOINT:
    volumes:
      - call_archive_data:/data/call-archive
    depends_on:
      postgres:
        condition: service_healthy
    # No host port binding — server is internal only.
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/api/v1/health"]
      interval: 10s
      timeout: 3s
      retries: 5

  web:
    image: ${WEB_IMAGE:-${IMAGE_REGISTRY:-ghcr.io}/${IMAGE_NAMESPACE:-signalforge-org}/signalforge-hub-web:${IMAGE_TAG:-latest}}
    restart: unless-stopped
    # Point your Plesk reverse proxy rule at this port.
    ports:
      - "${CLIENT_PORT:-3000}:8080"
    depends_on:
      api:
        condition: service_healthy

  mock-call-sender:
    image: ${MOCK_CALL_SENDER_IMAGE:-${IMAGE_REGISTRY:-ghcr.io}/${IMAGE_NAMESPACE:-signalforge-org}/signalforge-hub-mock-call-sender:${IMAGE_TAG:-latest}}
    restart: unless-stopped
    profiles: ["mock"]
    environment:
      SCANNER_URL: http://api:8080
      MOCK_INTERVAL_SEC: ${MOCK_INTERVAL_SEC:-5}
      MOCK_DURATION_SEC: ${MOCK_DURATION_SEC:-3}
      MOCK_SYSTEM_ID: ${MOCK_SYSTEM_ID:-1}
      MOCK_SYSTEM_LABEL: ${MOCK_SYSTEM_LABEL:-Mock P25 System}
      MOCK_FREQUENCY: ${MOCK_FREQUENCY:-460000000}
      MOCK_SOURCE_API_KEY: ${MOCK_SOURCE_API_KEY:-}
    depends_on:
      api:
        condition: service_healthy

  transcriber:
    image: ${TRANSCRIBER_IMAGE:-${IMAGE_REGISTRY:-ghcr.io}/${IMAGE_NAMESPACE:-signalforge-org}/signalforge-hub-transcriber:${IMAGE_TAG:-latest}}
    restart: unless-stopped
    environment:
      SIGNALFORGE_API_URL: http://api:8080
      TRANSCRIPTION_WORKER_TOKEN: ${TRANSCRIPTION_WORKER_TOKEN:-}
      TRANSCRIPTION_MODEL: ${TRANSCRIPTION_MODEL:-base}
      TRANSCRIPTION_DEVICE: ${TRANSCRIPTION_DEVICE:-cpu}
      TRANSCRIPTION_COMPUTE_TYPE: ${TRANSCRIPTION_COMPUTE_TYPE:-int8}
      TRANSCRIPTION_LANGUAGE: ${TRANSCRIPTION_LANGUAGE:-}
      TRANSCRIPTION_POLL_SECONDS: ${TRANSCRIPTION_POLL_SECONDS:-2}
      TRANSCRIPTION_MIN_DURATION_SECONDS: ${TRANSCRIPTION_MIN_DURATION_SECONDS:-0.75}
      TRANSCRIPTION_CPU_THREADS: ${TRANSCRIPTION_CPU_THREADS:-0}
      HF_TOKEN: ${HF_TOKEN:-}
    volumes:
      - transcriber_models:/models
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
  transcriber_models:
  call_archive_data:
