hub:
  base_url: https://p7hub.projectseven.us
  source_key: ""

decode:
  engine: trunk-recorder
  trunk_recorder:
    binary: trunk-recorder
    config_path: trunk-recorder.json
    ppm: 0
    gain: 40
    sample_rate: 2400000
  gophertrunk:
    binary: gophertrunk

sdr:
  auto_discover: true
  devices: []

trunking:
  systems:
    - name: OKWIN
      radioreference_sid: 6949
      sysid: "92C"
      wacn: "BEE00"
      nac: "BEE00"
      protocol: p25
      p25_phase1_demod_mode: c4fm
      p25_phase2_enabled: true
      talkgroup_csv: talkgroups-okwin-92C.csv
      sites: []

scanner:
  roles:
    - type: control_hunt
      sdrs: auto
    - type: voice
      sdrs: auto
    - type: conventional
      name: GMRS
      sdrs: auto
      channels:
        - "462.5625"
        - "462.5875"
        - "462.6125"
        - "462.6375"
        - "462.6625"
        - "462.6875"
        - "462.7125"
        - "467.5625"
        - "467.5875"
        - "467.6125"
        - "467.6375"
        - "467.6625"
        - "467.6875"
        - "467.7125"

recordings:
  directory: recordings

upload:
  queue_directory: upload-queue
  canary_interval: 5m
