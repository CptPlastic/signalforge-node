; SignalForge field handheld — monitor + PTT over WiFi to your hub.
; Recommended board: ESP32-S3 DevKitC-1 (N8R8 / PSRAM) for full 30s PTT clips.

[platformio]
default_envs = esp32s3

[common]
framework = arduino
monitor_speed = 115200
extra_scripts = post:scripts/patch_websockets.py
lib_deps =
	adafruit/Adafruit SSD1306 @ ^2.5.13
	adafruit/Adafruit GFX Library @ ^1.11.11
	adafruit/Adafruit BusIO @ ^1.16.1
	bblanchon/ArduinoJson @ ^7.2.0
	links2004/WebSockets @ ^2.6.1
	earlephilhower/ESP8266Audio @ ^1.9.8
build_flags =
	-D CORE_DEBUG_LEVEL=3
	-I include
	; Hub public/ws call frames are ~30KB JSON (audio base64). Library default is 15KB.
	-D WEBSOCKETS_MAX_DATA_SIZE=40960

[env:esp32s3]
platform = espressif32 @ ^6.9.0
board = esp32-s3-devkitc-1
extra_scripts = ${common.extra_scripts}
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 8MB
build_flags =
	${common.build_flags}
	-D ARDUINO_USB_CDC_ON_BOOT=1
	-D BOARD_HAS_PSRAM
	-D SIGNALFORGE_TARGET_S3=1
framework = ${common.framework}
monitor_speed = ${common.monitor_speed}
lib_deps = ${common.lib_deps}

[env:esp32]
platform = espressif32 @ ^6.9.0
board = esp32dev
build_flags =
	${common.build_flags}
	-D SIGNALFORGE_TARGET_ESP32=1
framework = ${common.framework}
monitor_speed = ${common.monitor_speed}
lib_deps = ${common.lib_deps}
extra_scripts = ${common.extra_scripts}
